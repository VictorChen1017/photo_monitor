<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Cookie/Token 傳輸</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 響應式 -->

    <!--   external style sheets, bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
  
  <link rel="stylesheet" type="text/css" href="./login/login.css"> 
  <link rel="stylesheet" type="text/css" href="./aside.css"> 
  


</head>
<body>

  <div class="main_container">

    <div id="sidebar-container"></div>

      <!-- 使用js呼叫sidebar -->
      <script>
          fetch("./aside.html")
              .then(response => response.text())
              .then(data => {
              document.getElementById("sidebar-container").innerHTML = data;
              });
      </script>

  

  <div id="login_container" class="content_container">

    <h2>輸入 Synology 登入資訊</h2>

    <button type="button" id="importBtn">載入資料庫</button>
    <div class="result" id="result">連接NAS狀態</div>
    <div class="result" id="importResult">同步資料庫狀態</div>



    <script>
    // 該段落用於匯入資料庫，執行import.php，並將結果顯示在頁面上

        function startDatabaseUpdate() {
        const resultElement = document.getElementById("result");
        const importElement = document.getElementById("importResult");

        resultElement.innerText = "連接NAS狀態：正在執行 Python 抓取 (request.php)...";
        importElement.innerText = "同步資料庫狀態：等待中 大約需要等候十幾秒...";

        // 1. 先執行 request.php (抓取資料)
        fetch("login/request.php", {
            method: "GET",
            headers: { "Cache-Control": "no-cache" }
        })
        .then(response => {
            if (!response.ok) throw new Error("Request.php 執行失敗");
            return response.text();
        })
        .then(data => {
            // 顯示第一個腳本的輸出
            resultElement.innerText = data;
            
            // 2. 確認成功後，接著執行 import.php (匯入資料)
            importElement.innerText = "Python 執行成功，正在匯入資料庫 (import.php)...";
            
            return fetch("login/import.php", { method: "POST" });
        })
        .then(response => {
            if (!response.ok) throw new Error("Import.php 執行失敗");
            return response.json();
        })
        .then(data => {
            // 3. 顯示最終匯入結果
            importElement.innerText = 
                `✅ 匯入完成，目前共 ${data.total} 筆資料\n` +
                `✅ 更新完成，本次更新 ${data.new} 筆資料\n` +
                `✅ 刪除 ${data.deleted} 筆資料\n` +
                `🕒 最後更新時間 ${data.last_update_time}`;

            window.importStats = {
                total: data.total,
                updated: data.new
            };
            console.log("儀表板用變數：", window.importStats);
        })
        .catch(error => {
            // 捕捉流程中任何一個環節的錯誤
            console.error("流程發生錯誤:", error);
            importElement.innerText = "❌ 執行中斷：" + error.message;
        });
    }
 
    document.getElementById("importBtn").addEventListener("click", function() {
      document.getElementById("importResult").innerText = "正在匯入資料庫，請稍候...";

      // 點擊資料庫後的處理邏輯
      startDatabaseUpdate()

    });
  </script>
  </div>
  </div>

</body>
</html>
