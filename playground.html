<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Cookie/Token 傳輸</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 響應式 -->

    <!--   external style sheets, bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
  
  <link rel="stylesheet" type="text/css" href="./login/login.css"> 
  <link rel="stylesheet" type="text/css" href="./aside.css"> 
  


</head>
<body>

  <div class="main_container">

    <div id="sidebar-container"></div>

      <!-- 使用js呼叫sidebar -->
      <script>
          fetch("./aside.html")
              .then(response => response.text())
              .then(data => {
              document.getElementById("sidebar-container").innerHTML = data;
              });
      </script>

  

    <div id="daily_container" class="content_container">
        <div class="daily-photo-card">
            <h3 class="daily-title">精彩回顧</h3>
            <p class="daily-desc">點擊下方按鈕，隨機瀏覽一張歷史照片</p>
            
            <button id="randomPhotoBtn" class="btn-daily">
                <i class="fas fa-dice"></i> <span>每日一圖</span>
            </button>
        </div>
    </div>
  </div>

</body>
</html>
